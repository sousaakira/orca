# Personal fork-only desktop builders for sousaakira/orca.
# Linux .deb (x64) + Windows setup (unsigned) + macOS arm64 DMG/ZIP (unsigned, Apple Silicon M1–M5).
# Does nothing on stablyai/orca even if this file exists there.
name: Personal Desktop Build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag, or SHA to build (default: the branch selected above)'
        required: false
        default: ''
        type: string
      create_release:
        description: 'Publish/replace the personal-desktop GitHub Release'
        type: boolean
        default: true

concurrency:
  group: personal-desktop-build-${{ inputs.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  RELEASE_TAG: personal-desktop

jobs:
  build:
    name: Build ${{ matrix.platform }}
    if: github.repository == 'sousaakira/orca'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
            artifact: orca-linux-deb
            path: dist/*.deb
          - platform: windows
            os: windows-latest
            artifact: orca-windows-setup
            path: dist/orca-windows-setup.exe
          - platform: mac-arm64
            # macos-15 ships Swift 6 (computer-use-macos requires swift-tools-version 6.0).
            os: macos-15
            artifact: orca-macos-arm64
            path: |
              dist/orca-macos-arm64.dmg
              dist/orca-macos-arm64.zip
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      NODE_OPTIONS: --max-old-space-size=4096

    steps:
      - name: Checkout requested ref
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref_name }}
          fetch-depth: 0

      - name: Cache electron-builder downloads
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: personal-electron-builder-${{ matrix.platform }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            personal-electron-builder-${{ matrix.platform }}-
            electron-builder-${{ matrix.platform }}-

      - uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: electron

      - name: Install Linux packaging tools
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fakeroot dpkg rpm

      - name: Build package inputs
        shell: bash
        run: |
          set -euo pipefail
          status=0
          pnpm run build:cli || status=1

          scripts=(build:relay build:electron-vite:parallel)
          pids=()
          for script in "${scripts[@]}"; do
            pnpm run "$script" &
            pids+=("$!")
          done

          for pid in "${pids[@]}"; do
            wait "$pid" || status=1
          done
          exit "$status"

      - name: Project web client from renderer build
        run: pnpm run build:web-from-renderer

      - name: Build native components
        run: pnpm run build:native

      - name: Build macOS helper apps
        if: matrix.platform == 'mac-arm64'
        run: |
          pnpm run build:computer-macos
          pnpm run build:keyboard-layout-macos
          pnpm run build:notification-status-macos

      - name: Build Windows process-table addons
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          node config/scripts/build-windows-process-tree-relay-addon.mjs --arch=x64
          node config/scripts/build-windows-process-tree-relay-addon.mjs --arch=arm64

      - name: Package Linux .deb
        if: matrix.platform == 'linux'
        env:
          ORCA_REUSE_PREPARED_NATIVE_RUNTIME: '1'
        run: >
          pnpm exec electron-builder
          --config config/electron-builder.config.cjs
          --linux deb
          --x64
          --publish never

      - name: Package Windows setup
        if: matrix.platform == 'windows'
        shell: bash
        env:
          ORCA_REUSE_PREPARED_NATIVE_RUNTIME: '1'
          ORCA_WIN_ADHOC: '1'
          ORCA_REQUIRE_RELAY_NATIVE_ADDONS: 'x64,arm64'
        run: >
          pnpm exec electron-builder
          --config config/electron-builder.config.cjs
          --win
          --publish never

      - name: Package macOS arm64
        if: matrix.platform == 'mac-arm64'
        env:
          ORCA_REUSE_PREPARED_NATIVE_RUNTIME: '1'
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: >
          pnpm exec electron-builder
          --config config/electron-builder.config.cjs
          --mac dmg zip
          --arm64
          --publish never

      - name: Upload platform artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish personal-desktop release
    if: >-
      always() &&
      github.repository == 'sousaakira/orca' &&
      inputs.create_release &&
      needs.build.result == 'success'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout for version metadata
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref_name }}
          fetch-depth: 1

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish rolling personal release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BUILD_REF: ${{ inputs.ref || github.ref_name }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(release-assets/*)
          if (( ${#assets[@]} == 0 )); then
            echo '::error::No release assets downloaded'
            exit 1
          fi

          version="$(node -p "require('./package.json').version")"
          sha="$(git rev-parse --short HEAD)"
          notes="$(cat <<EOF
          Personal desktop builds for \`${GH_REPO}\`.

          - Ref: \`${BUILD_REF}\`
          - Commit: \`${sha}\`
          - package.json version: \`${version}\`

          ## Downloads
          - **Linux**: \`orca-ide_*_amd64.deb\`
          - **Windows**: \`orca-windows-setup.exe\` (unsigned — SmartScreen may warn)
          - **macOS Apple Silicon (M1–M5)**: \`orca-macos-arm64.dmg\` (unsigned — right-click → Open the first time)

          ## Install
          \`\`\`bash
          # Linux
          sudo dpkg -i orca-ide_*.deb
          sudo apt-get install -f
          \`\`\`
          EOF
          )"

          if gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release delete "$RELEASE_TAG" --repo "$GH_REPO" --yes --cleanup-tag
          fi

          gh release create "$RELEASE_TAG" "${assets[@]}" \
            --repo "$GH_REPO" \
            --title "Personal Desktop (${version} / ${sha})" \
            --notes "$notes"
